name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # Same version as the API types in vendor/claude-code (vendor/claude-code/VERSION).
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Type-check
        run: npx -y -p typescript@5.6.3 tsc -p .
      - name: Validate plugin
        run: claude plugin validate .
      # Runs offline: the tests mock Codex, the clock and the file system; no login.
      - name: Plugin tests
        run: claude plugin test .
